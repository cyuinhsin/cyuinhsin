name: Update README

on:
  schedule:
    - cron: "0 0 * * *" # 每天 0 点运行
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
      - name: Install dependencies
        run: npm install node-fetch@2
      - name: Run update script
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: node update_readme.js
      - name: Commit and push changes
        env:
          PAT: ${{ secrets.PROFILE_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'chore: update README.md by GitHub Actions' || echo 'No changes to commit'
          git remote set-url origin https://cyuinhsin:${PAT}@github.com/cyuinhsin/cyuinhsin.git
          git push origin main
